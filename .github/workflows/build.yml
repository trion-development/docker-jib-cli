name: 'build images'

on:
  workflow_dispatch:
  schedule:
    - cron: '7 5 * * *'
  push:
  pull_request:

env:
  DOCKER_IMAGE: trion/jib-cli

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Jib CLI version
        id: version
        run: |
          V=$(sed -nE 's/^ARG JIB_CLI_VERSION=(.*)/\1/p' Dockerfile)
          echo "jib=${V}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.jib }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
